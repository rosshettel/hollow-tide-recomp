name: Build

# Push to main → refresh the moving `beta` pre-release assets.
# release.published → attach the same platform zips to that release only (never overwrite beta).
on:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SDL3_VERSION: "3.4.20"
  VULKAN_SDK_VERSION: "1.3.296.0"
  # SHA-1 of the measured USA 1ST_READ.BIN (game/hydrothunder.toml). CI never uploads it.
  HT_BOOT_SHA1: "d8d54a28eac55cb4b63d9693951f9582a1b2505a"

jobs:
  windows:
    name: windows-x64
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: seanmiddleditch/gha-setup-ninja@v5

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Install LLVM (clang-cl)
        shell: bash
        run: |
          choco install llvm --yes --no-progress
          echo "C:/Program Files/LLVM/bin" >> "$GITHUB_PATH"

      # Prebuilt LunarG installer (humbletim builds Glslang from source and broke on
      # windows-2025 / VS 18). Cache the installed SDK tree with actions/cache@v4.
      - name: Cache Vulkan SDK
        id: cache-vulkan
        uses: actions/cache@v4
        with:
          path: C:\VulkanSDK\${{ env.VULKAN_SDK_VERSION }}
          key: vulkan-sdk-windows-${{ env.VULKAN_SDK_VERSION }}

      - name: Install Vulkan SDK
        if: steps.cache-vulkan.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = $env:VULKAN_SDK_VERSION
          $url = "https://sdk.lunarg.com/sdk/download/$ver/windows/VulkanSDK-$ver-Installer.exe"
          $exe = Join-Path $env:RUNNER_TEMP 'VulkanSDK-Installer.exe'
          Write-Host "Downloading Vulkan SDK $ver"
          curl.exe -L --fail -o $exe $url
          $p = Start-Process -FilePath $exe -Wait -PassThru -ArgumentList `
            '--accept-licenses','--default-answer','--confirm-command','install'
          if ($p.ExitCode -ne 0) { throw "Vulkan SDK installer exited $($p.ExitCode)" }

      - name: Export Vulkan SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sdk = "C:\VulkanSDK\$env:VULKAN_SDK_VERSION"
          if (-not (Test-Path "$sdk\Bin\glslc.exe") -and -not (Test-Path "$sdk\Bin\glslangValidator.exe")) {
            throw "glslc/glslangValidator not found under $sdk"
          }
          "VULKAN_SDK=$sdk" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "$sdk\Bin" | Out-File $env:GITHUB_PATH -Append -Encoding utf8

      - name: Fetch SDL3 (VC devel + win32-x64 runtime)
        shell: bash
        run: |
          mkdir -p .deps
          curl -fsSL -o .deps/SDL3-devel-VC.zip \
            "https://github.com/libsdl-org/SDL/releases/download/release-${SDL3_VERSION}/SDL3-devel-${SDL3_VERSION}-VC.zip"
          curl -fsSL -o .deps/SDL3-win32-x64.zip \
            "https://github.com/libsdl-org/SDL/releases/download/release-${SDL3_VERSION}/SDL3-${SDL3_VERSION}-win32-x64.zip"
          python - <<'PY'
          import zipfile, pathlib
          root = pathlib.Path(".deps")
          with zipfile.ZipFile(root / "SDL3-devel-VC.zip") as z:
              z.extractall(root)
          with zipfile.ZipFile(root / "SDL3-win32-x64.zip") as z:
              z.extractall(root / "SDL3-win32-x64")
          PY
          # devel zip extracts to SDL3-<ver>/
          echo "SDL3_ROOT=$PWD/.deps/SDL3-${SDL3_VERSION}" >> "$GITHUB_ENV"
          echo "HT_SDL3_DLL=$PWD/.deps/SDL3-win32-x64/SDL3.dll" >> "$GITHUB_ENV"

      - name: Restore boot binary
        shell: bash
        env:
          HT_BOOT_URL: ${{ secrets.HT_BOOT_URL }}
          HT_BOOT_AUTH: ${{ secrets.HT_BOOT_AUTH }}
        run: bash tools/ci_restore_boot.sh

      - name: Configure (clang-cl)
        shell: bash
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl \
            -DCMAKE_PREFIX_PATH="$SDL3_ROOT" \
            -DDREAM_BUILD_TESTS=OFF \
            -DDREAMCOMP_FRONTEND=ON \
            -DDREAM_WERROR=OFF

      - name: Build
        shell: bash
        run: cmake --build build --target hydrothunder_boot --parallel

      - name: Package
        shell: bash
        id: pkg
        run: |
          shortsha="$(echo "${{ github.sha }}" | cut -c1-7)"
          echo "shortsha=$shortsha" >> "$GITHUB_OUTPUT"
          # Relative path: upload-artifact on Windows cannot resolve Git Bash /d/a/... paths.
          zip_rel="dist/hollow-tide-windows-${shortsha}.zip"
          export HT_ZIP_PATH="$PWD/$zip_rel"
          # HT_SDL3_DLL already set from the win32-x64 runtime fetch step.
          bash tools/package_windows.sh build "$shortsha"
          test -f "$HT_ZIP_PATH"
          echo "zip=$zip_rel" >> "$GITHUB_OUTPUT"

      - name: Audit zip (no game data)
        shell: bash
        run: |
          python -c "import zipfile,sys; print('\n'.join(zipfile.ZipFile(sys.argv[1]).namelist()))" \
            "${{ steps.pkg.outputs.zip }}" | tee /tmp/zip-list.txt
          if grep -Eiq '1ST_READ|\.chd|extracted/|/gen/' /tmp/zip-list.txt; then
            echo "zip contains forbidden game data" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: hollow-tide-windows-${{ steps.pkg.outputs.shortsha }}
          path: ${{ steps.pkg.outputs.zip }}
          if-no-files-found: error

  macos:
    name: macos-arm64
    # Prefer macos-14, but it remapped to unsupported macos-14-arm64-us-default here.
    # macos-latest is the current GitHub-hosted Apple Silicon image.
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install deps (Homebrew)
        run: |
          brew install ninja sdl3 molten-vk shaderc vulkan-loader || true
          brew list ninja sdl3 molten-vk shaderc >/dev/null

      - name: Restore boot binary
        env:
          HT_BOOT_URL: ${{ secrets.HT_BOOT_URL }}
          HT_BOOT_AUTH: ${{ secrets.HT_BOOT_AUTH }}
        run: bash tools/ci_restore_boot.sh

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DDREAM_BUILD_TESTS=OFF \
            -DDREAMCOMP_FRONTEND=ON \
            -DDREAM_WERROR=OFF

      - name: Build
        run: cmake --build build --target hydrothunder_boot --parallel

      - name: Package
        id: pkg
        run: |
          shortsha="$(echo "${{ github.sha }}" | cut -c1-7)"
          echo "shortsha=$shortsha" >> "$GITHUB_OUTPUT"
          zip_rel="dist/hollow-tide-macos-arm64-${shortsha}.zip"
          export HT_ZIP_PATH="$PWD/$zip_rel"
          bash tools/package_macos.sh build "$shortsha"
          test -f "$HT_ZIP_PATH"
          echo "zip=$zip_rel" >> "$GITHUB_OUTPUT"

      - name: Audit zip (no game data)
        run: |
          python3 -c "import zipfile,sys; print('\n'.join(zipfile.ZipFile(sys.argv[1]).namelist()))" \
            "${{ steps.pkg.outputs.zip }}" | tee /tmp/zip-list.txt
          if grep -Eiq '1ST_READ|\.chd|extracted/|/gen/' /tmp/zip-list.txt; then
            echo "zip contains forbidden game data" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: hollow-tide-macos-arm64-${{ steps.pkg.outputs.shortsha }}
          path: ${{ steps.pkg.outputs.zip }}
          if-no-files-found: error

  android:
    name: android (stub — M9)
    if: false
    runs-on: ubuntu-latest
    steps:
      - run: echo "Android packaging lands in M9"

  publish:
    name: publish release assets
    needs: [windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Short SHA
        id: meta
        run: echo "shortsha=$(echo '${{ github.sha }}' | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect zips
        id: zips
        run: |
          mkdir -p dist
          find artifacts -name 'hollow-tide-*.zip' -exec cp -v {} dist/ \;
          ls -la dist/
          # Stable names for softprops glob; keep shortsha in the filename.
          test -f "dist/hollow-tide-windows-${{ steps.meta.outputs.shortsha }}.zip"
          test -f "dist/hollow-tide-macos-arm64-${{ steps.meta.outputs.shortsha }}.zip"

      - name: Refresh moving beta pre-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Drop prior beta assets so shortsha-named zips do not accumulate.
          if gh release view beta --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release view beta --repo "${{ github.repository }}" --json assets \
              --jq '.assets[].name' | while read -r name; do
              [[ -n "$name" ]] || continue
              gh release delete-asset beta "$name" --repo "${{ github.repository }}" --yes || true
            done
          fi

      - name: Upload to beta (push to main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta
          name: beta
          prerelease: true
          target_commitish: ${{ github.sha }}
          body: |
            Moving pre-release build from `main` @ ${{ github.sha }}.
            Platform zips only — no disc image, no `1ST_READ.BIN`, no extracted game data.
            Pick your own `.chd` / `.gdi` / `.cue` in the launcher.
          files: |
            dist/hollow-tide-windows-${{ steps.meta.outputs.shortsha }}.zip
            dist/hollow-tide-macos-arm64-${{ steps.meta.outputs.shortsha }}.zip
          fail_on_unmatched_files: true
          make_latest: false

      - name: Upload to published release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            dist/hollow-tide-windows-${{ steps.meta.outputs.shortsha }}.zip
            dist/hollow-tide-macos-arm64-${{ steps.meta.outputs.shortsha }}.zip
          fail_on_unmatched_files: true
          # Do not touch the beta tag/release.
